# CI for sky130-crypto-rot. Tool-light: no Docker. One job needs the PDK:
# netlist-freshness re-synthesizes the committed crypto_rot_top netlist from
# the RTL (issue #88).
#
# What runs here: format and known-answer correctness -- Python/shell
# syntax, the pin and register-map table lints, the golden models against
# the committed published vectors, and the reuse.lock.json hashes -- plus,
# on PRs and merge-group entries (the merge queue's trial merges, issue
# #283) touching rtl/ or verification/, the
# `verify` job: the sha256, aes, drbg, hmac, keyladder and trng_if benches with
# their negative controls and the SymbiYosys tasks (scripts/ci-verify.sh), and
# `netlist-freshness`: the committed crypto_rot_top netlist re-synthesized and
# byte-compared (verification/rtl/crypto_rot_top/netlist/check-fresh.sh). It
# makes no security claim.
# `fv-report-freshness` (issue #296): the committed crypto_rot_top
# functional-verification report checked against its input-hash envelope
# (verification/rtl/crypto_rot_top/fv_report.py check) -- tool-light, no
# simulator and no PDK, because the pinned klt 0.8.0 writes no input hashes
# and has no `functional-verification --check`.
# What stays local: place-and-route, DRC, LVS, signoff (PDK-heavy beyond the
# freshness synthesis), sha256 --million-a, verification/formal/keyladder and
# verification/formal/crypto_rot_top.
# See README.md "Reproduce" and verification/README.md "What CI runs vs. what
# stays local"; change those documents together with this file if a heavy leg
# moves into CI.
#
# Every job runs one command a developer can run unchanged: `npm run lint`,
# `npm run test` and `npm run check:reuse` for the three tool-light jobs,
# ./scripts/ci-verify.sh for `verify` (there is no `npm run verify`), and
# verification/rtl/crypto_rot_top/netlist/check-fresh.sh for
# `netlist-freshness`, python3 verification/rtl/crypto_rot_top/fv_report.py
# check for `fv-report-freshness`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm run lint

  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install pytest
      - run: npm run test

  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm run check:reuse

  # Runs on every PR and every merge-group entry (so a required check is
  # never left pending) but skips its steps unless rtl/, verification/,
  # flow/ or the environment pins changed.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        # Shared gate (issue #283): PR = head vs merge-base with the target
        # branch, as before; merge_group = the trial merge vs the event's
        # merge_group.base_sha (github.base_ref is empty there); every other
        # event runs all steps. An empty or unresolvable base fails the job
        # -- it never reads as "no watched path changed".
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          out="$(./scripts/ci-changed.sh '^(rtl/|verification/|flow/|scripts/(setup-env|ci-verify)\.sh$|\.github/workflows/ci\.yml$)')"
          echo "$out" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: steps.changed.outputs.run == 'true'
        # yosys provides the native `yosys-abc` that sby's `abc bmc3`/`abc pdr`
        # engines call; the pinned YoWASP wheel has no standalone abc.
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-${{ hashFiles('scripts/setup-env.sh') }}
      - if: steps.changed.outputs.run == 'true'
        run: ./scripts/setup-env.sh
      - if: steps.changed.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci-verify.sh

  # Freshness of the committed crypto_rot_top gate-level netlist (issue #88):
  # re-synthesizes from the RTL and byte-compares against the committed
  # artifact. This is the one CI leg that needs the PDK and synthesis (the
  # item-1 attestation's `derived` check, marked local_only there), so it is
  # its own job rather than a step of `verify` -- which stays the tool-light
  # bench subset and never synthesizes. The committed signoff gate
  # (.github/workflows/signoff.yml) carries this check's committed outcome,
  # so an RTL edit that skips regeneration fails HERE first.
  netlist-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        # Same shared gate as `verify` (issue #283), with this job's filter.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          out="$(./scripts/ci-changed.sh '^(rtl/|verification/|flow/|scripts/setup-env\.sh$|\.github/workflows/ci\.yml$)')"
          echo "$out" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-${{ hashFiles('scripts/setup-env.sh') }}
      - if: steps.changed.outputs.run == 'true'
        run: ./scripts/setup-env.sh
      - if: steps.changed.outputs.run == 'true'
        run: ./verification/rtl/crypto_rot_top/netlist/check-fresh.sh

  # Freshness of the committed crypto_rot_top functional-verification report
  # (issue #296): the report run.sh commits beside its request must be what
  # the current request, RTL and bench produce. Tool-light -- python3 stdlib
  # only, no simulator, no PDK, no .venv: the pinned klt 0.8.0 writes no
  # input hashes and has no `functional-verification --check` (a 0.9.x
  # feature), so the check is the repo's own hash envelope, on the
  # check-fresh.sh pattern. Exit 3 on drift fails the job, so an RTL,
  # testbench or request edit cannot merge without regenerating the report.
  fv-report-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        # Same shared gate as `verify` (issue #283), with this job's filter.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          out="$(./scripts/ci-changed.sh '^(rtl/|verification/|flow/|scripts/setup-env\.sh$|\.github/workflows/ci\.yml$)')"
          echo "$out" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: steps.changed.outputs.run == 'true'
        run: python3 verification/rtl/crypto_rot_top/fv_report.py check
